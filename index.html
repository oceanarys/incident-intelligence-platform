<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Incident Intelligence Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Incident Intelligence Platform</h1>

<button onclick="loadIncidents()">Load Incidents</button>

<ul id="incidentList"></ul>

<script>
  const supabaseUrl = "https://xnrrjsegjfpidvvlaiju.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhucnJqc2VnamZwaWR2dmxhaXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjE0NjcsImV4cCI6MjA4NjUzNzQ2N30.lqW1KJtDAlowuAE8CstKJXdh91iOjzlkhxvS_ewBcsk";
  
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function loadIncidents() {
    const { data, error } = await supabase
      .from("incidents")
      .select("*");

    if (error) {
      alert("Error: " + error.message);
      return;
    }

    const list = document.getElementById("incidentList");
    list.innerHTML = "";

    data.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item.description || "No description";
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
